# ── ORTHOSHOEFIX ────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name orthoshoefix.com www.orthoshoefix.com;

    root /var/www/html/orthoshoefix/public;
    index index.php index.html;
    charset utf-8;

    client_max_body_size 20M;

    # IP real del cliente (detrás del nginx reverse proxy del host)
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;

    access_log /var/log/nginx/orthoshoefix_access.log;
    error_log  /var/log/nginx/orthoshoefix_error.log;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Archivos estáticos con caché
    location ~* \.(jpg|jpeg|png|gif|ico|svg|css|js|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass orthoshoefix:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }

    # .well-known SÍ debe ser público (challenges ACME, security.txt, etc.)
    location ^~ /.well-known/ {
        allow all;
    }

    # Bloquear acceso al resto de archivos ocultos
    location ~ /\. {
        deny all;
    }
}
