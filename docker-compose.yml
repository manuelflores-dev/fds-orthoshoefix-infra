name: fds-orthoshoefix

# Rotación de los logs de Docker (docker compose logs): sin esto crecen sin
# límite y tarde o temprano llenan el disco del servidor.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:

  # ── PHP-FPM ORTHOSHOEFIX (Laravel 13 + Livewire — projects/orthoshoefix) ────
  orthoshoefix:
    build: ./docker-config/php/orthoshoefix
    container_name: ${PHP_CONTAINER}
    restart: unless-stopped
    logging: *logging
    environment:
      TZ: America/Chicago
    volumes:
      - ./projects/orthoshoefix:/var/www/html/orthoshoefix
    networks:
      - custom-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── NGINX CENTRALIZADO (un server{} por dominio) ────────────────────────────
  nginx:
    image: nginx:stable-alpine
    container_name: ${NGINX_CONTAINER}
    restart: unless-stopped
    logging: *logging
    environment:
      TZ: America/Chicago
    ports:
      # Solo local: el TLS lo termina el nginx reverse proxy del host
      - "127.0.0.1:${NGINX_PORT}:80"
    volumes:
      - ./projects:/var/www/html:ro
      - ./docker-config/nginx:/etc/nginx/conf.d:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - custom-network
    depends_on:
      - orthoshoefix

  # ── MARIADB 12.3 ──────────────────────────────────────────────────────────────
  db:
    image: mariadb:12.3
    container_name: ${MARIADB_CONTAINER}
    restart: unless-stopped
    logging: *logging
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      # Al cambiar de versión de MariaDB, actualiza sola las tablas del sistema.
      MARIADB_AUTO_UPGRADE: \"1\"
      TZ: America/Chicago
    ports:
      - "127.0.0.1:${MARIADB_PORT}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker-config/mariadb/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - custom-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── REDIS ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:8-alpine
    container_name: ${REDIS_CONTAINER}
    restart: unless-stopped
    logging: *logging
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    environment:
      TZ: America/Chicago
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - custom-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  custom-network:
    name: ${DOCKER_NETWORK_NAME}
    driver: bridge

# Docker prefija los volúmenes con el `name:` de la primera línea, NO con el
# nombre de la carpeta. Por eso quedan como fds-orthoshoefix_mariadb_data y
# fds-orthoshoefix_redis_data, aunque muevas o renombres el repo.
volumes:
  mariadb_data:
  redis_data:
