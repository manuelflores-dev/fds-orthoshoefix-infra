; === DESARROLLO LOCAL ===
; Solo lo monta docker-compose.dev.yml, encima del php.ini de producción
; (zz- para cargarse al final y ganarle). En el servidor nunca se usa.

; Errores en pantalla
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; OPcache revisa los archivos en cada petición: los cambios se ven sin reiniciar
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; En local se entra por http, no https
session.cookie_secure = 0

; Xdebug → PhpStorm en el puerto 9003 del host. Solo se activa cuando lo pides
; (extensión "Xdebug helper" del navegador o XDEBUG_TRIGGER), para no hacer lenta
; cada petición.
xdebug.mode = debug
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
